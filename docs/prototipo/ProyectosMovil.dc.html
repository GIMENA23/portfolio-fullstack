<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Proyectos en celular · arce.dev</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#EFE9E1}
a{color:#160F10}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.in{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

/* Navbar fija con menú desplegable (corrección del profesor) */
.m-header{position:sticky;top:0;z-index:50;background:#EFE9E1}
.m-check{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.m-toggle{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#160F10;cursor:pointer}
.m-check:focus-visible + .m-toggle{outline:3px solid #E3B04B;outline-offset:2px}
.m-toggle .x{display:none}
.m-check:checked + .m-toggle .x{display:block}
.m-check:checked + .m-toggle .h{display:none}
.m-menu{display:none;position:absolute;left:0;right:0;top:100%;background:#160F10;padding:8px 16px 20px;flex-direction:column;box-shadow:0 12px 0 -4px rgba(22,15,16,.25)}
.m-check:checked ~ .m-menu{display:flex;animation:drop .3s ease-out both}
.m-menu a{color:#EFE9E1;text-decoration:none;padding:14px 0;border-bottom:1px solid #3A2E2E;font-family:Syne,sans-serif;font-weight:700;font-size:20px}
.m-menu a.m-cta{margin-top:16px;text-align:center;background:#E5545B;color:#160F10;padding:13px;border:0;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:16px}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 390px; min-height: 1700px; box-sizing: border-box; background: #EFE9E1; color: #160F10; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.55;">
  <header class="m-header" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #D8CEC2;">
    <a href="Movil.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
      <svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><rect x="5" y="5" width="24" height="24" transform="rotate(45 17 17)" fill="#9B1B22"></rect><text x="17" y="21" text-anchor="middle" font-family="Syne, sans-serif" font-weight="800" font-size="11" fill="#FFF4EC">ma</text></svg>
      <span style="font-family: Syne, sans-serif; font-weight: 800; font-size: 18px;">arce.dev</span>
    </a>
    <input type="checkbox" id="movil-menu" class="m-check" aria-label="Abrir o cerrar el menú"><label for="movil-menu" class="m-toggle" title="Menú"><svg class="h" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EFE9E1" stroke-width="2.2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><svg class="x" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EFE9E1" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></label>
    <nav aria-label="Menú" class="m-menu">
      <a href="Movil.dc.html">Inicio</a>
      <a href="ProyectosMovil.dc.html">Proyectos</a>
      <a href="Servicios.dc.html">Servicios</a>
      <a href="ContactoMovil.dc.html">Contacto</a>
      <a href="Login.dc.html" class="m-cta">Ingresar o registrarme</a>
    </nav>
  </header>
  <section style="background: #9B1B22; color: #FFF4EC; padding: 28px 16px; display: flex; flex-direction: column; gap: 6px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #E3B04B;">6 PROYECTOS · DEMOS</span>
    <h1 style="margin: 0; font-family: Syne, sans-serif; font-weight: 800; font-size: 40px; line-height: 0.95; text-transform: uppercase;">Proyectos</h1>
  </section>
  <div aria-hidden="true" style="height: 16px; background: linear-gradient(#160F10 0 4px, transparent 4px 6px, #160F10 6px 10px, transparent 10px 12px, #160F10 12px), #E3B04B;"></div>
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <div style="background: #160F10; color: #EFE9E1; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px;">
      <span>Registrate gratis para ver el detalle y las demos.</span>
      <a href="Registro.dc.html" style="align-self: flex-start; background: #E5545B; color: #160F10; padding: 8px 14px; font-weight: 600; font-size: 14px; text-decoration: none;">Crear cuenta</a>
    </div>
    <div role="group" aria-label="Filtrar por tecnología" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
    <sc-for list="{{shown}}" as="p" hint-placeholder-count="4">
      <a href="Registro.dc.html" class="in" style="animation-delay: {{p.delay}}; text-decoration: none; background: #F8F4EE; border: 1px solid #D8CEC2; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column;">
        <div style="height: 130px; background: {{p.color}}; position: relative;"><span style="position: absolute; top: 10px; right: 10px; background: #160F10; color: #E3B04B; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; padding: 3px 7px;">REQUIERE REGISTRO</span></div>
        <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #9B1B22;">{{p.tags}}</span><h3 style="margin: 0; font-family: Syne, sans-serif; font-weight: 700; font-size: 18px;">{{p.title}}</h3><p style="margin: 0; font-size: 14px; color: #5E5550;">{{p.text}}</p></div>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'Todos' }; }
  renderVals() {
    const all = [
      { title: 'Gestor de turnos', text: 'Reservas online con roles y avisos por email.', tags: 'REACT · NODE · MONGODB', stack: ['React', 'Node', 'MongoDB'], color: '#9B1B22' },
      { title: 'Dashboard de ventas', text: 'Métricas con filtros y gráficos.', tags: 'REACT · CHART.JS', stack: ['React'], color: '#160F10' },
      { title: 'Tienda online', text: 'Carrito, pagos y control de stock.', tags: 'EXPRESS · MONGODB', stack: ['Node', 'MongoDB'], color: '#8A5A35' },
      { title: 'Clima en vivo', text: 'Pronóstico con una API externa.', tags: 'FETCH · CHART.JS', stack: ['APIs'], color: '#4F6B3E' },
    ];
    const on = 'flex: none; font-family: Instrument Sans, sans-serif; font-weight: 600; font-size: 14px; padding: 8px 14px; min-height: 40px; cursor: pointer; background: #160F10; color: #EFE9E1; border: 1.5px solid #160F10;';
    const off = 'flex: none; font-family: Instrument Sans, sans-serif; font-weight: 600; font-size: 14px; padding: 8px 14px; min-height: 40px; cursor: pointer; background: transparent; color: #160F10; border: 1.5px solid #D8CEC2;';
    const filters = ['Todos', 'React', 'Node', 'MongoDB', 'APIs'].map((n) => ({ label: n, style: this.state.filter === n ? on : off, pick: () => this.setState({ filter: n }) }));
    const shown = (this.state.filter === 'Todos' ? all : all.filter((p) => p.stack.includes(this.state.filter))).map((p, i) => ({ ...p, delay: i * 80 + 'ms' }));
    return { filters, shown };
  }
}
</script>
</body>
</html>
