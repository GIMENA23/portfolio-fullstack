<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bandeja del operador en celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#F8F4EE}
a{color:#160F10}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.slide{animation:slide .3s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; min-height: 1300px; box-sizing: border-box; background: #F8F4EE; color: #160F10; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5;">
  <header style="position: sticky; top: 0; z-index: 50; background: #EFE9E1; border-bottom: 1px solid #D8CEC2; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: Syne, sans-serif; font-weight: 800; font-size: 17px;">arce.dev</span>
      <span style="align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; padding: 2px 6px; background: #160F10; color: #E3B04B;">PANEL OPERADOR</span>
    </div>
    <a href="Login.dc.html" style="display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #160F10; color: #EFE9E1; text-decoration: none; font-size: 13px; font-weight: 600;">Salir</a>
  </header>
  <div aria-hidden="true" style="height: 8px; background: linear-gradient(#160F10 0 3px, transparent 3px 5px, #160F10 5px), #E3B04B;"></div>

  <sc-if value="{{list}}" hint-placeholder-val="{{true}}">
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: end;"><h1 style="margin: 0; font-family: Syne, sans-serif; font-weight: 800; font-size: 26px; text-transform: uppercase;">Consultas</h1><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9B1B22;">7 NUEVAS</span></div>
      <div style="display: flex; gap: 6px; overflow-x: auto;">
        <span style="flex: none; font-weight: 600; font-size: 13px; padding: 7px 12px; border: 1.5px solid #9B1B22; background: #FFFFFF;">Todas</span>
        <span style="flex: none; font-weight: 600; font-size: 13px; padding: 7px 12px; border: 1.5px solid #D8CEC2;">Cotización</span>
        <span style="flex: none; font-weight: 600; font-size: 13px; padding: 7px 12px; border: 1.5px solid #D8CEC2;">General</span>
        <span style="flex: none; font-weight: 600; font-size: 13px; padding: 7px 12px; border: 1.5px solid #D8CEC2;">Asesoría</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <button type="button" onClick="{{r.open}}" style="all: unset; box-sizing: border-box; cursor: pointer; background: #FFFFFF; border: 1px solid #D8CEC2; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;">
          <span style="display: flex; justify-content: space-between; gap: 8px;"><strong style="font-family: 'Instrument Sans', sans-serif;">{{r.name}}</strong><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5E5550;">{{r.date}}</span></span>
          <span style="font-family: 'Instrument Sans', sans-serif; font-size: 14px; color: #5E5550;">{{r.type}} · {{r.subject}}</span>
          <span style="{{r.pill}}">{{r.status}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{detail}}" hint-placeholder-val="{{false}}">
    <div class="slide" style="padding: 16px; display: flex; flex-direction: column; gap: 14px;">
      <button type="button" onClick="{{back}}" style="all: unset; cursor: pointer; font-weight: 600; font-family: 'Instrument Sans', sans-serif;">← Volver a consultas</button>
      <div style="background: #FFFFFF; border: 1px solid #D8CEC2; border-top: 3px solid #9B1B22; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
        <strong style="font-family: Syne, sans-serif; font-size: 20px;">{{sel.name}}</strong>
        <span style="font-size: 13px; color: #5E5550;">{{sel.email}} · {{sel.type}}</span>
        <p style="margin: 0; background: #F8F4EE; padding: 10px 12px;">{{sel.message}}</p>
        <label for="bm-resp" style="display: flex; flex-direction: column; gap: 6px; font-weight: 600;">Responder por email
          <textarea id="bm-resp" rows="5" style="font-family: 'Instrument Sans', sans-serif; font-size: 16px; padding: 10px 12px; border: 1.5px solid #D8CEC2; border-radius: 4px; resize: vertical;">Hola, gracias por escribir. Te paso una propuesta con tiempos y costos estimados.</textarea>
        </label>
        <a href="EmailRespuesta.dc.html" style="text-align: center; background: #160F10; color: #EFE9E1; padding: 14px; font-weight: 600; text-decoration: none;">Enviar respuesta</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: null }; }
  renderVals() {
    const pills = { nueva: 'background: #9B1B22; color: #FFF4EC;', 'en proceso': 'background: #160F10; color: #E3B04B;', respondida: 'background: #4F6B3E; color: #F8F4EE;' };
    const icons = { nueva: '● ', 'en proceso': '◐ ', respondida: '✓ ' };
    const data = [
      { name: 'Lucía Gómez', email: 'lucia@ejemplo.com', type: 'Cotización', subject: 'Tienda online', date: '15/10', status: 'nueva', message: 'Vendo cerámica artesanal y quiero una tienda con carrito y pagos.' },
      { name: 'Martín Díaz', email: 'martin@correo.com', type: 'Cotización', subject: 'Sistema de turnos', date: '15/10', status: 'nueva', message: 'Necesito que mis pacientes saquen turno online y reciban un recordatorio.' },
      { name: 'Sofía López', email: 'sofia@estudio.com', type: 'Asesoría', subject: 'Revisión de API', date: '14/10', status: 'en proceso', message: 'Tenemos una API en Express que se volvió lenta.' },
      { name: 'Juan Pérez', email: 'juan@ejemplo.com', type: 'General', subject: 'Mantenimiento', date: '12/10', status: 'respondida', message: '¿Ofrecés mantenimiento mensual?' },
    ];
    const rows = data.map((d, i) => ({ ...d, status: icons[d.status] + d.status.toUpperCase(), pill: 'align-self: flex-start; font-family: JetBrains Mono, monospace; font-size: 10px; padding: 2px 8px; border-radius: 999px; ' + pills[d.status], open: () => this.setState({ sel: i }) }));
    const s = this.state.sel;
    return { rows, list: s === null, detail: s !== null, sel: s === null ? data[0] : data[s], back: () => this.setState({ sel: null }) };
  }
}
</script>
</body>
</html>
